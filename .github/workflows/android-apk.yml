name: Build Android APK (Flutter)

on:
  workflow_dispatch:  # tu pourras le lancer à la main depuis l’onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Tu peux essayer sans fixer la version.
          # Si ça casse, on pourra la figer plus tard, ex: '3.19.6'
          # flutter-version: '3.19.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: koel-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
